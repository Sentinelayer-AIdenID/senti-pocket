name = "senti-live-call"
main = "worker.mjs"
compatibility_date = "2025-01-01"

# One Durable Object instance per call room (idFromName(roomId) in worker.mjs).
[[durable_objects.bindings]]
name = "CALL_ROOM"
class_name = "CallRoomDO"

# SQLite-backed DO (the default for new classes); supports storage KV + alarms used by call-do.mjs.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoomDO"]

[vars]
# CF_REALTIME_APP_ID is public. GATEWAY_AUTHORIZE_URL is the gateway endpoint the Worker POSTs the CLIENT's own
# bearer to for a bearer->role decision (co-designed with warden; unset => fail closed, admits no one). There is NO
# shared admin token — authorization is the connecting client's own Senti bearer, forwarded.
# The App Secret is NEVER committed — set it once per environment:
#   wrangler secret put CF_REALTIME_APP_SECRET   # the CF Realtime App Secret (stays server-side)
CF_REALTIME_APP_ID = ""
GATEWAY_AUTHORIZE_URL = ""
