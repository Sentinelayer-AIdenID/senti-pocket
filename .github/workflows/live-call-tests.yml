name: Live-call and voice tools CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# Read-only verification of the dependency-free Node tools: no secrets, no deploy, no token beyond read.
permissions:
  contents: read

jobs:
  voice-tools:
    name: Live-call and voice-replay tests
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node 22.23.2
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2

      - name: Run the live-call suite
        working-directory: tools/live-call
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 ./*.test.mjs

      - name: Run the voice-replay suite
        working-directory: tools/voice-replay
        shell: bash
        run: |
          set -euo pipefail
          node --test --test-concurrency=2 ./*.test.mjs
