name: Omar Gate (Jev)
on:
  pull_request:
    types: [opened, synchronize, reopened]
# Write scopes publish the PR report (comment + check run, tagged jev so it never overwrites the legacy Omar Gate's),
# exactly like the legacy omar-gate.yml. GitHub gives fork PRs a read-only token, and fork_policy: block fails them closed.
permissions:
  contents: read
  pull-requests: write
  actions: read
  checks: write
# Fork PRs are NOT skipped: a skipped job counts as a passing required check. The action's fork_policy: block fails them
# closed instead (forks also receive no secrets, so the private configuration is missing and the review is refused).
jobs:
  omar-jev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Omar Gate (Jev intent cascade)
        uses: Sentinelayer-AIdenID/sentinelayer-v1-action@0dbc0ed545f4c21a5a0e9095ad6ff872af19a03c
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          review_routing: intent-cascade-v1
          llm_provider: typesafe
          typesafe_api_key: ${{ secrets.TYPESAFE_API_KEY }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          intent_model_pin: ${{ secrets.INTENT_MODEL_PIN }}
          intent_policy: ${{ secrets.INTENT_POLICY }}
          intent_price_profile: typesafe-input-20261020
          sentinelayer_token: ${{ secrets.SENTINELAYER_TOKEN }}
          scan_mode: pr-diff
          severity_gate: P1
          codex_model: gpt-6-sol
          use_codex: "false"
          codex_only: "false"
          sentinelayer_managed_llm: "false"
          llm_failure_policy: block
          fork_policy: block
          publish_github: "true"
          comment_tag: jev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: omar-jev-${{ github.run_id }}
          path: .sentinelayer/runs/
          include-hidden-files: true
          if-no-files-found: error

